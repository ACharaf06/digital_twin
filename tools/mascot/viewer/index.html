<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GLB preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #edece7;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #info {
        position: fixed;
        left: 8px;
        top: 8px;
        font: 12px ui-monospace, monospace;
        color: #222;
        background: #fff9;
        padding: 6px 8px;
        white-space: pre;
        border-radius: 4px;
        max-width: 46vw;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./three.module.js",
          "three/addons/": "./jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">loading…</div>
    <script type="module">
      import * as THREE from 'three'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

      const params = new URLSearchParams(location.search)
      const file = params.get('file') || 'model.glb'
      const wire = params.get('wire') === '1'

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.setSize(innerWidth, innerHeight)
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.toneMappingExposure = 1.05
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap
      document.body.appendChild(renderer.domElement)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xedece7)
      const pmrem = new THREE.PMREMGenerator(renderer)
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture

      const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100)

      const key = new THREE.DirectionalLight(0xfff4e2, 2.1)
      key.position.set(2.4, 4.2, 3.2)
      key.castShadow = true
      key.shadow.mapSize.set(2048, 2048)
      scene.add(key)
      const rim = new THREE.DirectionalLight(0xdce8ff, 1.15)
      rim.position.set(-2.8, 2.4, -2.6)
      scene.add(rim)
      scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8778, 0.55))

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(6, 48),
        new THREE.MeshStandardMaterial({ color: 0xdcdbd2, roughness: 0.95 }),
      )
      ground.rotation.x = -Math.PI / 2
      ground.receiveShadow = true
      scene.add(ground)

      const info = document.getElementById('info')
      const loader = new GLTFLoader()

      loader.load(
        file,
        (gltf) => {
          const model = gltf.scene
          // report structure
          let tris = 0
          let meshes = 0
          let skinned = 0
          const bones = []
          const morphNames = new Set()
          model.traverse((o) => {
            if (o.isMesh) {
              meshes++
              const gm = o.geometry
              tris += (gm.index ? gm.index.count : gm.attributes.position.count) / 3
              o.castShadow = true
              o.receiveShadow = true
              // Hunyuan shape output ships POSITION only — shade it anyway.
              if (!gm.attributes.normal) gm.computeVertexNormals()
              if (!o.material || o.material.color === undefined)
                o.material = new THREE.MeshStandardMaterial({ color: 0xd8d5cc, roughness: 0.7 })
              if (wire) {
                o.material = new THREE.MeshBasicMaterial({
                  color: 0x365beb,
                  wireframe: true,
                  transparent: true,
                  opacity: 0.5,
                })
              }
              // ?weights=1 -> paint each vertex by its dominant bone
              if (params.get('weights') === '1' && gm.attributes.skinIndex) {
                const si = gm.attributes.skinIndex
                const sw = gm.attributes.skinWeight
                const count = si.count
                const colors = new Float32Array(count * 3)
                const PALETTE = [
                  [0.85, 0.2, 0.2], [0.95, 0.55, 0.15], [0.9, 0.85, 0.2], [0.35, 0.75, 0.3],
                  [0.2, 0.7, 0.65], [0.25, 0.5, 0.9], [0.45, 0.3, 0.85], [0.85, 0.35, 0.75],
                  [0.6, 0.4, 0.25], [0.5, 0.85, 0.85], [0.95, 0.75, 0.6], [0.4, 0.4, 0.45],
                  [0.7, 0.9, 0.4], [0.9, 0.45, 0.45], [0.3, 0.35, 0.7], [0.75, 0.7, 0.9],
                  [0.1, 0.55, 0.35],
                ]
                for (let i = 0; i < count; i++) {
                  let bestJ = si.getX(i)
                  let bestW = sw.getX(i)
                  const cand = [
                    [si.getY(i), sw.getY(i)], [si.getZ(i), sw.getZ(i)], [si.getW(i), sw.getW(i)],
                  ]
                  for (const [j, w] of cand) if (w > bestW) { bestW = w; bestJ = j }
                  const c = PALETTE[bestJ % PALETTE.length]
                  colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2]
                }
                gm.setAttribute('color', new THREE.BufferAttribute(colors, 3))
                o.material = new THREE.MeshBasicMaterial({ vertexColors: true })
              }
              if (o.morphTargetDictionary)
                Object.keys(o.morphTargetDictionary).forEach((k) => morphNames.add(k))
            }
            if (o.isSkinnedMesh) skinned++
            if (o.isBone) bones.push(o.name)
          })

          // pose bones: ?pose=RightShoulder.z:1.0,RightElbow.x:-0.4
          const poseSpec = params.get('pose')
          if (poseSpec) {
            const byName = new Map()
            model.traverse((o) => byName.set(o.name, o))
            for (const clause of poseSpec.split(',')) {
              const [target, value] = clause.split(':')
              const [boneName, axis] = target.split('.')
              const bone = byName.get(boneName)
              if (!bone) {
                console.error('no such bone: ' + boneName)
                continue
              }
              bone.rotation[axis] = parseFloat(value)
            }
            model.updateMatrixWorld(true)
          }

          // ?clip=<name>&t=<seconds> samples one frame of an animation clip
          const clipName = params.get('clip')
          if (clipName && gltf.animations?.length) {
            const clip =
              gltf.animations.find((c) => c.name === clipName) ||
              gltf.animations.find((c) => c.name.includes(clipName)) ||
              gltf.animations[0]
            const mixer = new THREE.AnimationMixer(model)
            mixer.clipAction(clip).play()
            mixer.setTime(parseFloat(params.get('t') || '0'))
            model.updateMatrixWorld(true)
            info.textContent += `\nclip      ${clip.name} @ ${params.get('t') || 0}s`
          }
          window.__clips = (gltf.animations || []).map((c) => c.name)

          // normalize: center on origin, scale to 1.8 units tall, feet on ground
          const box = new THREE.Box3().setFromObject(model)
          const size = box.getSize(new THREE.Vector3())
          const rawHeight = size.y
          const scale = 1.8 / rawHeight
          model.scale.setScalar(scale)
          const box2 = new THREE.Box3().setFromObject(model)
          const c = box2.getCenter(new THREE.Vector3())
          model.position.x -= c.x
          model.position.z -= c.z
          model.position.y -= box2.min.y
          scene.add(model)

          const target = new THREE.Vector3(0, parseFloat(params.get('ty') || '0.95'), 0)
          const yaw = parseFloat(params.get('yaw') || '0')
          const pitch = parseFloat(params.get('pitch') || '0')
          const dist = parseFloat(params.get('dist') || '5.2')
          camera.position.set(
            Math.sin(yaw) * Math.cos(pitch) * dist,
            target.y + Math.sin(pitch) * dist,
            Math.cos(yaw) * Math.cos(pitch) * dist,
          )
          camera.lookAt(target)
          key.target.position.copy(target)
          scene.add(key.target)

          info.textContent = [
            `file      ${file}`,
            `meshes    ${meshes}  (skinned ${skinned})`,
            `triangles ${Math.round(tris).toLocaleString()}`,
            `bones     ${bones.length}`,
            `morphs    ${morphNames.size ? [...morphNames].join(',') : 'none'}`,
            `raw size  ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}`,
            `scale→1.8 ${scale.toFixed(4)}`,
          ].join('\n')

          renderer.render(scene, camera)
          window.__scene = scene; window.__THREE = THREE; window.__ready = true
          window.__report = { meshes, skinned, tris: Math.round(tris), bones, morphs: [...morphNames] }
        },
        undefined,
        (err) => {
          info.textContent = 'LOAD ERROR: ' + err.message
          window.__scene = scene; window.__THREE = THREE; window.__ready = true
          window.__error = String(err.message || err)
        },
      )
    </script>
  </body>
</html>
