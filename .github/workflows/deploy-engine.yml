# The engine half of production. Cloudflare Workers Builds already deploys the
# studio on every push to main, so this must never touch web/dist -- two systems
# deploying the same site would fight over the custom domain.
#
# Authentication is keyless: GitHub proves its identity to Google per run, and
# only this repository is allowed to impersonate the deployer account. There is
# no service-account key to leak or rotate.
name: Deploy engine

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.gcloudignore'
      # The browser imports this and the engine reads it, so a profile change
      # has to reach both halves. Cloudflare redeploys the studio on its own.
      - 'content/profile.json'
      - '.github/workflows/deploy-engine.yml'
  workflow_dispatch: # a deploy with no code change, when only config moved

concurrency:
  group: deploy-engine # never let two revisions race to serve traffic
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt
      - run: pip install -r engine/requirements-dev.txt
      - run: python -m pytest
        working-directory: engine

  deploy:
    needs: test # a red suite must not reach production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token Google exchanges for credentials
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: charafachir-twin
          workload_identity_provider: projects/918447994863/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@charafachir-twin.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Built from the repository root, not engine/: agent/prompts.py resolves
      # content/profile.json from two directories above itself, so an image
      # built from engine/ alone serves /health and then fails the first turn.
      # Secrets and env stay as configured on the service and are not restated
      # here, so a deploy cannot silently drop one.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy twin-engine \
            --source . \
            --region us-central1 \
            --quiet

      - name: Verify the revision actually serves
        run: |
          URL=$(gcloud run services describe twin-engine --region us-central1 --format='value(status.url)')
          for i in $(seq 1 10); do
            body=$(curl -sf --max-time 20 "$URL/health") && break
            echo "  not ready yet ($i/10)"; sleep 5
          done
          echo "$body" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("status:", d["status"], "| passages:", d["retrieval"]["passages"])
          # "ready" needs a reachable model; the index must have actually loaded.
          assert d["status"] == "ready", d
          assert d["retrieval"]["ready"] and d["retrieval"]["passages"] > 0, d
          '
